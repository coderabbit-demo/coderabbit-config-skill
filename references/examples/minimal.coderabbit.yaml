# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Signal-only reference config: merge blockers, nothing else.
# Adapted from coderabbit-demo/starter-config (initial.coderabbit.yaml).
#
# Good starting point for teams adopting CodeRabbit on a busy repo, or for teams
# whose engineers will hand findings to an AI agent to fix.

tone_instructions: Prefer concise responses (high information density, low fluff)
inheritance: true

reviews:
  profile: chill
  request_changes_workflow: false
  disable_cache: true

  # Keep the PR comment small.
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  auto_apply_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false

  high_level_summary: true
  high_level_summary_instructions: "Give a brief description of the changes in 50 words or less."
  high_level_summary_in_walkthrough: false

  path_instructions:
    - path: "**/*"
      instructions: >
        - Restrict feedback to errors, security risks, and functionality-breaking problems.
        - Ignore minor or stylistic concerns; do not comment on code style, formatting, or
          non-critical improvements.
        - Keep reviews short: flag only issues that make the PR unsafe to merge.
        - Limit review comments to 3-5 items maximum unless additional blockers exist.
        - Group similar issues into a single comment instead of posting multiple notes.
        - If a pattern repeats, mention it once at summary level only.
        - Avoid line-by-line commentary unless it highlights a critical bug or security hole.
        - Highlight only issues that could cause runtime errors, data loss, or severe
          maintainability problems.
        - Provide a top-level summary of critical blockers rather than detailed per-line notes.
        - Comment only when the issue must be resolved before merge; otherwise remain silent.
        - If there are no critical problems, respond with minimal approval (e.g. 'Looks good')
          and add nothing else.

  auto_review:
    auto_incremental_review: true

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"

knowledge_base:
  issues:
    scope: local
  pull_requests:
    scope: local
